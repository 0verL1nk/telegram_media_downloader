[package]
name = "telegram-media-downloader"
version = "0.2.3"
description = "Lightweight Telegram media download desktop client"
authors = ["0verL1nk"]
license = "MIT"
repository = "https://github.com/0verL1nk/telegram_media_downloader"
edition = "2024"
rust-version = "1.95"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = ["unstable", "tray-icon"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-updater = "=2.12.0"
tauri-plugin-process = "=2.3.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "=2.0.3", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { version = "=2.0.3", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "tls-rustls-ring"] }
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
url = "2"
fs2 = "0.4"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_System_Com"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# CI 发布构建速度优先:thin LTO + 4 个代码生成单元,换取每次发布快 3-5 分钟,
# 运行时/体积代价约 1-3%(下载客户端不敏感)。
codegen-units = 4
lto = "thin"
opt-level = 3
strip = true
panic = "abort"
