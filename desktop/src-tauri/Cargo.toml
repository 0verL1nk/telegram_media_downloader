[package]
name = "telegram-media-downloader"
version = "0.2.0"
description = "Lightweight Telegram media download desktop client"
authors = ["0verL1nk"]
license = "MIT"
repository = "https://github.com/0verL1nk/telegram_media_downloader"
edition = "2024"
rust-version = "1.95"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = ["unstable"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.5"
grammers-client = { version = "=0.10.0", default-features = false, features = ["fs", "proxy"] }
grammers-session = { version = "=0.10.0", default-features = false, features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sea-orm = { version = "=2.0.3", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { version = "=2.0.3", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "tls-rustls-ring"] }
keyring = "4"
chacha20poly1305 = "0.11"
getrandom = "0.3"
blake3 = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "=1.13.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
thiserror = "2"
anyhow = "1"
url = "2"
mime_guess = "2"
fs2 = "0.4"
zip = { version = "6", default-features = false, features = ["deflate"] }
walkdir = "2"
glass_pumpkin = "=2.0.0-rc0"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_System_Com"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
