[[permission]]
identifier = "allow-main-commands"
description = "Allow the trusted local React interface to call the desktop application commands"
commands.allow = [
  "get_app_state",
  "save_settings",
  "list_tasks",
  "probe_task_video",
  "extract_video_frame",
  "get_task_video_thumbnail",
  "set_task_video_cover",
  "task_action",
  "delete_task",
  "open_task_location",
  "get_logs",
  "ensure_telegram_webview",
  "probe_telegram_inject",
  "set_telegram_webview_visible",
  "set_telegram_webview_bounds",
  "change_storage_root"
]
