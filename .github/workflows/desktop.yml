name: Desktop client

on:
  push:
    branches: [master]
    paths:
      - "desktop/**"
      - "docs/**"
      - ".github/workflows/desktop.yml"
    # 打 v* 标签时自动打包并发布 Release(路径过滤不作用于标签推送)
    tags: ["v*"]
  pull_request:
    branches: [master]
    paths:
      - "desktop/**"
      - "docs/**"
      - ".github/workflows/desktop.yml"
  # 每天预热一次 release 档编译缓存(见 warm-release-cache:缓存按 ref 隔离,
  # 只有默认分支保存的缓存才能被 tag 运行恢复)。
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  checks:
    name: Windows x64 checks
    # 定时任务只跑缓存预热,不做重复的检查。
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          shared-key: desktop-rust # checks 自己的 debug 档缓存(仅本任务使用)
          cache-all-crates: true
      - name: Install frontend packages
        working-directory: desktop
        run: npm ci
      - name: Type-check and build React UI
        working-directory: desktop
        run: npm run build
      - name: Check Rust formatting
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Test Rust core
        working-directory: desktop/src-tauri
        run: cargo test --locked
      # 安装包只在 tag 的 release 任务里构建并签名,这里不做重复编译。

  # 预热 release 档编译缓存:Action 缓存按 ref 隔离,tag 运行保存的缓存只有同一个
  # tag 才能恢复,而默认分支(master)保存的缓存可以被任何 ref 恢复。所以由这里
  # (master 作用域)编译一次 release 并保存缓存,release 任务只做只读恢复。
  warm-release-cache:
    name: Warm release cache
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore cargo home
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-home-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-cargo-home-
      - name: Restore release target dir
        uses: actions/cache/restore@v4
        with:
          path: desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-release-target-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-cargo-release-target-
      - name: Install frontend packages
        working-directory: desktop
        run: npm ci
      # --no-bundle 只做 release 编译(与 tauri-action 的构建环境一致),
      # 安装包仍然只由发布任务打包。
      - name: Build release profile
        working-directory: desktop
        run: npx tauri build --no-bundle
      - name: Save cargo home
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-home-${{ github.run_id }}
      - name: Save release target dir
        uses: actions/cache/save@v4
        with:
          path: desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-release-target-${{ github.run_id }}

  release:
    name: Publish signed release
    if: startsWith(github.ref, 'refs/tags/')
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: write # 创建 Release 并上传安装包、签名与 latest.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      # 这里只做只读恢复(actions/cache/restore):缓存按 ref 隔离,tag 运行保存的
      # 缓存对其他 tag 完全不可见,写入只会白占配额。缓存的写入统一交给
      # warm-release-cache(master 作用域,每天预热),release 任务只负责消费。
      - name: Restore cargo home
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-home-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-cargo-home-
      - name: Restore release profile target dir
        uses: actions/cache/restore@v4
        with:
          path: desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-release-target-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-cargo-release-target-
      - name: Install frontend packages
        working-directory: desktop
        run: npm ci
      # tauri-action 负责 `tauri build`、创建同名 Release、上传安装包与 `.sig` 签名,
      # 并生成 updater 的 latest.json(应用内“检查更新”读取的清单)。
      # createUpdaterArtifacts 只在此处以 --config 打开:若写进 tauri.conf.json,
      # 本地 `npx tauri build` 会因为没有 TAURI_SIGNING_PRIVATE_KEY 而直接失败。
      # updaterJsonPreferNsis: NSIS 默认按当前用户安装,更新时无需 UAC 提权。
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: "" # 留空,使用自动生成的发行说明
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          args: --config '{"bundle":{"createUpdaterArtifacts":true}}'

# 缓存模型(Action 缓存按 ref 隔离):
# - tag 运行保存的缓存只有同一个 tag 能再取到;默认分支保存的缓存可被任何 ref 恢复。
# - 因此 release 任务只读恢复,warm-release-cache(master,每日)负责编译并保存 release 档缓存。
# - checks 任务用 Swatinem/rust-cache 自带的"去掉锁哈希"回退,天然跨版本恢复。
#
# 发布流程:更新 desktop/src-tauri/tauri.conf.json 与 desktop/package.json 的版本,
# 提交后打标签并推送:`git tag v0.2.1 && git push origin v0.2.1`
# 打标签会触发 checks 再进入 release:tauri-action 构建 MSI/NSIS 安装包(附带 .sig 签名),
# 创建同名 GitHub Release,并上传 latest.json 供应用内自动更新使用。
# 注意:只有内置了 updater 插件的版本(≥ 本次发布)才能自动更新;更早的手动安装版本
# 需要用户自行下载安装一次带 updater 的版本。
#
# To extend the matrix, add macos-latest/Linux runners with their required
# Tauri system libraries, keep the same npm/cargo check steps, and enable the
# corresponding Tauri bundle targets in tauri.conf.json.
